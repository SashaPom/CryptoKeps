spring.application.name=cryptokeps
server.port=8080

# JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
#spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=15
spring.jpa.hibernate.ddl-auto=none

# DataSource (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.max-lifetime=1800000

# BYBIT ---- Demo/Main
bybit.api.use-demo=false

# Telegram
telegram.token=8312408187:AAHJDX--kj926a--p3XEwW04zJmDcE5-RXI
telegram.username=CryptoKepsTradingBot

# Liquibase
spring.liquibase.change-log=classpath:liquibase/changelog.yaml
spring.liquibase.enabled=true

# Logging
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
