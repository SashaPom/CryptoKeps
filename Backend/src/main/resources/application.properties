spring.application.name=cryptokeps

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=15
spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=cosmo-pool

# BYBIT ---- Demo/Main
bybit.api.use-demo=false

# Liquibase
spring.liquibase.change-log=classpath:liquibase/changelog.yaml
spring.liquibase.enabled=true

application.rest-client.response-timeout=5000

logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security.oauth2=ERROR
logging.level.org.springframework.web.client=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.com.zaxxer.hikari=DEBUG
