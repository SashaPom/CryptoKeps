server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: django
          uri: http://django:8001
          predicates:
            - Path=/api/py/dj/**
          filters:
            - StripPrefix=3
#            - name: BasicAuth
#              args:
#                username: ${GATEWAY_BASIC_USERNAME}
#                password: ${GATEWAY_BASIC_PASSWORD}

        - id: java
          uri: http://java:8080
          predicates:
            - Path=/api/java/**
          filters:
            - StripPrefix=2
#            - name: BasicAuth
#              args:
#                username: ${GATEWAY_BASIC_USERNAME}
#                password: ${GATEWAY_BASIC_PASSWORD}

        - id: watcher-okx
          uri: ws://watcher-okx:8889
          predicates:
            - Path=/ws/okx,/ws/okx/**
          filters:
            - StripPrefix=2
#            - name: BasicAuth
#              args:
#                username: ${GATEWAY_BASIC_USERNAME}
#                password: ${GATEWAY_BASIC_PASSWORD}

        - id: watcher-binance
          uri: ws://watcher-binance:8890
          predicates:
            - Path=/ws/binance,/ws/binance/**
          filters:
            - StripPrefix=2
#            - name: BasicAuth
#              args:
#                username: ${GATEWAY_BASIC_USERNAME}
#                password: ${GATEWAY_BASIC_PASSWORD}
