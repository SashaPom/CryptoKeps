services:
  # PostgreSQL для Java
  postgres:
    image: postgres:17
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ck
    ports:
      - "${CK_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb/00-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$CK_DB_USER -d $$CK_DB_NAME" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Java backend
  java:
    build:
      context: ..
      dockerfile: Dockerfile
    # image: yourorg/java:prod   # для прода вместо build
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - ../logs:/app/logs
      - ../config:/app/config
    # ports:
    #   - "8080:8080"          # локально НЕ обязательно, gateway ходит по сети docker

  # Django API
  django:
    build: ../../tw-m-main
    env_file:
      - ../../tw-m-main/.env
    depends_on:
      postgres:
        condition: service_healthy
    # image: yourorg/django:prod
    expose: ["8001"]

  # Watcher OKX
  watcher-okx:
    build: ../../tw-main
    env_file: ../../tw-main/.env.okx
    ports: ["8889:8889"]                         # публикуем наружу для теста; в проде можно убрать
    # environment:
      # SSL для продакшена:
      # SSL_CERTFILE: /etc/letsencrypt/live/cryptokeps.com/fullchain.pem
      # SSL_KEYFILE:  /etc/letsencrypt/live/cryptokeps.com/privkey.pem
    # volumes:
    #   - /etc/letsencrypt:/etc/letsencrypt:ro   # включить в проде

  # Watcher Binance
  watcher-binance:
    build: ../../tw-main
    env_file: ../../tw-main/.env.binance
    ports: ["8890:8890"]
#    environment:
      # SSL для продакшена:
      # SSL_CERTFILE: /etc/letsencrypt/live/cryptokeps.com/fullchain.pem
      # SSL_KEYFILE:  /etc/letsencrypt/live/cryptokeps.com/privkey.pem
    # volumes:
    #   - /etc/letsencrypt:/etc/letsencrypt:ro

  # Gateway (UI ходит сюда на /api/** и /ws/**)
  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    # image: yourorg/gateway:prod
    ports: ["8080:8080"]
    depends_on: [django, java, watcher-okx, watcher-binance]

networks:
  default:
    name: appnet

volumes:
  postgres-data:
