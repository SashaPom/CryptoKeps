services:
  # PostgreSQL для Java
  postgres:
    image: postgres:17
    env_file:
      - ../.env
      - ../../tw_m_main/.env
    expose: ["5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb/00-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$CK_DB_USER -d $$CK_DB_NAME" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [ appnet ]


  # Java backend
  java:
    build:
      context: ..
      dockerfile: Dockerfile
    # image: yourorg/java:prod   # для прода вместо build
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8080"]
    volumes:
      - ../logs:/app/logs
      - ../config:/app/config
    networks: [ appnet ]


  # Django API
  django:
    build: ../../tw_m_main
    env_file:
      - ../../tw_m_main/.env
    depends_on:
      postgres:
        condition: service_healthy
    # image: yourorg/django:prod
    expose: ["8001"]
    networks: [ appnet ]


  # Watcher OKX
  watcher-okx:
    build: ../../tw_main
    env_file: ../../tw_main/.env.okx
    depends_on: [gateway]
    expose: ["8889"]
    # environment:
      # SSL для продакшена:
      # SSL_CERTFILE: /etc/letsencrypt/live/cryptokeps.com/fullchain.pem
      # SSL_KEYFILE:  /etc/letsencrypt/live/cryptokeps.com/privkey.pem
    # volumes:
    #   - /etc/letsencrypt:/etc/letsencrypt:ro   # включить в проде
    networks: [ appnet ]


  # Watcher Binance
  watcher-binance:
    build: ../../tw_main
    env_file: ../../tw_main/.env.binance
    depends_on: [gateway]
    expose: ["8890"]
#    environment:
      # SSL для продакшена:
      # SSL_CERTFILE: /etc/letsencrypt/live/cryptokeps.com/fullchain.pem
      # SSL_KEYFILE:  /etc/letsencrypt/live/cryptokeps.com/privkey.pem
    # volumes:
    #   - /etc/letsencrypt:/etc/letsencrypt:ro
    networks: [ appnet ]


  # Gateway (UI ходит сюда на /api/** и /ws/**)
  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    env_file:
      - ../.env
    # image: yourorg/gateway:prod
    ports: ["8080:8080"]
    depends_on: [django, java]
    networks: [ appnet ]


networks:
  appnet: {}

volumes:
  postgres-data:
